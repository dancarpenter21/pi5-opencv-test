<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pi 5 Face Detection</title>
  <style>
    body { margin: 2rem auto; padding: 0 1rem; max-width: 960px; font-family: system-ui, sans-serif; background: #15191e; color: #f3f4f6; }
    img { display: block; width: 100%; height: auto; border-radius: 8px; background: #000; }
    p { color: #bec6d0; }
  </style>
</head>
<body>
  <h1>Pi 5 Face Detection</h1>
  <p>{{ status }} · Red boxes mark detected faces.</p>
  <img src="{{ url_for('stream') }}" alt="Live camera stream with red face boxes">
  <p>Frontal faces work best. If the stream stops, refresh this page to check its status.</p>
</body>
</html>
